[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "aa-incursion-status"
description = "Incursion status and history for Alliance Auth"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.15"
authors = [
    { name = "Redone0001" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = [
    "allianceauth>=5,<6",
    "django-eveonline-sde>=0.2,<0.3",
    "django-esi>=9.4,<10",
]

[project.urls]
Source = "https://github.com/Redone0001/aa-incursion-page"
Tracker = "https://github.com/Redone0001/aa-incursion-page/issues"

[tool.hatch.version]
path = "incursionstatus/__init__.py"

[tool.hatch.build]
include = ["/incursionstatus"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
